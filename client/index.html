<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore the saved theme (or fall back to the OS preference) before the
      // app renders, so a returning user opens in their last choice with no flash.
      (function () {
        try {
          var saved = localStorage.getItem('automatorr-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          /* localStorage unavailable — keep the default light theme */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/speccify-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Speccify: compare any two PC parts head-to-head with verified specs, benchmark-based scores and live Australian pricing, or plan a full compatibility-checked build and find the cheapest store. Free, independent, updated daily."
    />
    <meta property="og:title" content="Speccify: Compare PC parts. Build your rig. Buy it for less." />
    <meta
