# Nginx site for the Speccify TEST environment.
# The single-process Node app serves BOTH the built client and /api, so Nginx
# proxies the whole host to it (it does not serve static files itself).
# certbot --nginx will add the :443 server block + HTTP→HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name test.speccify.info;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
